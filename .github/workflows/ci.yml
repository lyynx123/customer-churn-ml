name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "uv"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      # Build inference artifacts in CI (deterministic, reproduces exact SHA256)
      - name: Build inference artifacts
        run: |
          uv run python -m customer_churn.data
          uv run python -m customer_churn.split
          uv run python -m customer_churn.predict
          uv run python scripts/extract_inference_artifacts.py

      # Verify artifact integrity and production config
      - name: Verify inference artifacts
        run: |
          uv run python scripts/verify_inference_artifacts.py --artifacts-dir models

      # CLI smoke test with real artifacts
      - name: CLI smoke test
        run: |
          uv run python -m customer_churn.portable_predict \
            --input tests/fixtures/portable_smoke_input.csv \
            --artifacts models \
            --output /tmp/smoke_predictions.csv

      - name: Run tests
        run: uv run pytest -q

      - name: Ruff check
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Type check (pyright)
        run: uv run pyright src

      - name: Package build
        run: uv build