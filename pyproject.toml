[project]
name = "customer-churn"
version = "0.1.0"
description = "Customer churn prediction pipeline"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "mypy>=1.5",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
    "ipykernel>=6.27",
    "shap>=0.44",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that perform full-project or expensive evaluation",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
